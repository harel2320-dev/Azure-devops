trigger:
  branches:
    include:
    - main
    - devops/*

pool:
  vmImage: ubuntu-latest

variables:
  major: 1
  minor: 0
  patch: $[counter(format('{0}.{1}', variables['major'], variables['minor']), 0)]
  version: $(major).$(minor).$(patch)
  isDevops: $[startsWith(variables['Build.SourceBranch'], 'refs/heads/devops/')]

steps:
  - task: UseDotNet@2
    displayName: Install .NET 10 SDK
    inputs:
      packageType: sdk
      version: 10.x

  - script: echo "Version = $(version)"
    displayName: Print version

  # Default artifact name for every branch
  - bash: echo "##vso[task.setvariable variable=artifactName]HelloWorld"
    displayName: Default artifact name

  # devops/* only: override the name to <branch>_<version> and tag the run
  - bash: |
      BRANCH="${BUILD_SOURCEBRANCH#refs/heads/}"
      BRANCH="${BRANCH//\//-}"
      NAME="${BRANCH}_$(version)"
      echo "Artifact name: $NAME"
      echo "##vso[task.setvariable variable=artifactName]$NAME"
      echo "##vso[build.addbuildtag]$NAME"
    displayName: Name and tag (devops/* only)
    condition: and(succeeded(), eq(variables['isDevops'], 'True'))

  - script: dotnet build src/HelloWorld/HelloWorld.csproj -c Release -p:Version=$(version)
    displayName: Build

  - script: dotnet publish src/HelloWorld/HelloWorld.csproj -c Release --no-build -o $(Build.ArtifactStagingDirectory)/app
    displayName: Publish to staging folder

  - script: >
      dotnet pack src/HelloWorld/HelloWorld.csproj -c Release --no-build
      -p:PackageVersion=$(version) -o $(Build.ArtifactStagingDirectory)/nupkg
    displayName: Pack NuGet (devops/* only)
    condition: and(succeeded(), eq(variables['isDevops'], 'True'))

  - task: NuGetAuthenticate@1
    displayName: Authenticate to Azure Artifacts (devops/* only)
    condition: and(succeeded(), eq(variables['isDevops'], 'True'))

  - script: >
      dotnet nuget push "$(Build.ArtifactStagingDirectory)/nupkg/*.nupkg"
      --source "https://pkgs.dev.azure.com/hareloosh007/Harel/_packaging/hello-feed/nuget/v3/index.json"
      --api-key az
    displayName: Push NuGet to feed (devops/* only)
    condition: and(succeeded(), eq(variables['isDevops'], 'True'))

  # The single upload: the app folder, named HelloWorld or <branch>_<version>
  - task: PublishPipelineArtifact@1
    displayName: Upload artifact
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/app
      artifactName: $(artifactName)