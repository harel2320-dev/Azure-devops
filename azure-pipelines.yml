trigger:
  branches:
    include:
    - main
    - devops/*

pool:
  vmImage: ubuntu-latest

variables:
  major: 1
  minor: 0
  patch: $[counter(format('{0}.{1}', variables['major'], variables['minor']), 0)]
  version: $(major).$(minor).$(patch)
  isDevops: $[startsWith(variables['Build.SourceBranch'], 'refs/heads/devops/')]

steps:
  # Full git history (SonarQube needs it)
  - checkout: self
    fetchDepth: 0

  - task: UseDotNet@2
    displayName: Install .NET 10 SDK
    inputs:
      packageType: sdk
      version: 10.x

  - script: echo "Version = $(version)"
    displayName: Print version

  # Default artifact name for every branch
  - bash: echo "##vso[task.setvariable variable=artifactName]HelloWorld"
    displayName: Default artifact name

  # devops/* only: override the name to <branch>_<version> and tag the run
  - bash: |
      BRANCH="${BUILD_SOURCEBRANCH#refs/heads/}"
      BRANCH="${BRANCH//\//-}"
      NAME="${BRANCH}_$(version)"
      echo "Artifact name: $NAME"
      echo "##vso[task.setvariable variable=artifactName]$NAME"
      echo "##vso[build.addbuildtag]$NAME"
    displayName: Name and tag (devops/* only)
    condition: and(succeeded(), eq(variables['isDevops'], 'True'))

  # SonarQube: prepare BEFORE build, analyze AFTER build (devops/* only)
  - task: SonarCloudPrepare@4.4.0
    displayName: Sonar prepare (devops/* only)
    condition: and(succeeded(), eq(variables['isDevops'], 'True'))
    inputs:
      SonarCloud: 'sonarcloud-conn'
      organization: 'harel2320-dev'
      scannerMode: 'dotnet'
      projectKey: 'harel2320-dev_Azure-devops'
      projectName: 'Azure-devops'
      projectVersion: '$(version)'
      extraProperties: |
        sonar.cs.opencover.reportsPaths=$(Build.SourcesDirectory)/TestResults/**/coverage.opencover.xml

  - script: dotnet build src/HelloWorld/HelloWorld.csproj -c Release -p:Version=$(version)
    displayName: Build

  # Tests run on EVERY branch (a failing test fails the build everywhere).
  # Inside the Sonar prepare/analyze window on devops/*, so the report is imported.
  # -p:Version keeps HelloWorld.dll at the pipeline version (same bin/Release folder as Build).
  - script: >
      dotnet test tests/HelloWorld.Tests -c Release
      -p:Version=$(version)
      --collect:"XPlat Code Coverage"
      --results-directory $(Build.SourcesDirectory)/TestResults
      -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
    displayName: Test with coverage

  - task: SonarCloudAnalyze@4.4.0
    displayName: Sonar analyze (devops/* only)
    condition: and(succeeded(), eq(variables['isDevops'], 'True'))
    inputs:
      jdkversion: 'JAVA_HOME_21_X64'

  - task: SonarCloudPublish@4.4.0
    displayName: Sonar quality gate (devops/* only)
    condition: and(succeeded(), eq(variables['isDevops'], 'True'))
    inputs:
      pollingTimeoutSec: '300'

  - script: dotnet publish src/HelloWorld/HelloWorld.csproj -c Release --no-build -o $(Build.ArtifactStagingDirectory)/app
    displayName: Publish to staging folder

  # NuGet: devops/* only
  - script: >
      dotnet pack src/HelloWorld/HelloWorld.csproj -c Release --no-build
      -p:PackageVersion=$(version) -o $(Build.ArtifactStagingDirectory)/nupkg
    displayName: Pack NuGet (devops/* only)
    condition: and(succeeded(), eq(variables['isDevops'], 'True'))

  - task: NuGetAuthenticate@1
    displayName: Authenticate to Azure Artifacts (devops/* only)
    condition: and(succeeded(), eq(variables['isDevops'], 'True'))

  - script: >
      dotnet nuget push "$(Build.ArtifactStagingDirectory)/nupkg/*.nupkg"
      --source "https://pkgs.dev.azure.com/hareloosh007/Harel/_packaging/hello-feed/nuget/v3/index.json"
      --api-key az
    displayName: Push NuGet to feed (devops/* only)
    condition: and(succeeded(), eq(variables['isDevops'], 'True'))

  # The single upload: the app folder, named HelloWorld or <branch>_<version>
  - task: PublishPipelineArtifact@1
    displayName: Upload artifact
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/app
      artifactName: $(artifactName)

  # Part 1: the product as a Universal Package in the Azure Artifacts feed (main only, never on PR builds)
  - task: UniversalPackages@0
    displayName: Publish app to feed (main only)
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    inputs:
      command: publish
      publishDirectory: $(Build.ArtifactStagingDirectory)/app
      feedsToUsePublish: internal
      vstsFeedPublish: Harel/hello-feed
      vstsFeedPackagePublish: helloworld-app
      versionOption: custom
      versionPublish: $(version)
      packagePublishDescription: HelloWorld app build $(version)